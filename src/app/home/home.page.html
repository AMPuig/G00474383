<!--Header with student number and favourites button-->
<ion-header>
  <ion-toolbar>
    <ion-title>G00474383</ion-title>
    <ion-buttons slot="end">
      <!--Icon button to navigate to favourites page-->
      <ion-button (click)="goToFavourites()">
        <ion-icon name="heart"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!--Search bar movie name-->
  <ion-item>
    <ion-input [(ngModel)]="searchTerm" placeholder="Movie Name" label="Search"></ion-input>
  </ion-item>
  <!--Search button--> 
  <ion-button expand="full" (click)="search()">SEARCH</ion-button>

  <!--Title of the page and list of movies -->
  <ion-list>
    <ion-item *ngFor="let movie of movies" (click)="goToMovieDetails(movie)" button>
      <ion-img slot="start" [src]="'https://image.tmdb.org/t/p/w200' + movie.poster_path" style="width:100px"></ion-img>
      <ion-label class="ion-text-wrap">
        {{ movie.overview }}
        <!-- Movie rating, vote count and release year from TMDB -->
  <p>⭐ {{ movie.vote_average | number:'1.1-1' }}/10 ({{ movie.vote_count }} votes) · {{ movie.release_date | slice:0:4 }}</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
